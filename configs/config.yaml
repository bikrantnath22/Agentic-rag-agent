# Main configuration file for RAG system
# Most settings can be overridden by environment variables

system:
  name: "Enterprise RAG Agent"
  version: "0.1.0"
  environment: "development"

llm:
  provider: "gemini"
  model: "gemini-3.5-flash-lite"
  temperature: 0.2
  max_tokens: 4096
  timeout: 60

prompts:
  templates_dir: "configs/prompts"
  system_prompt: "configs/prompts/default.txt"
  rag_prompt: "configs/prompts/rag_prompt.txt"
  reflection_prompt: "configs/prompts/reflection_prompt.txt"
  query_rewrite_prompt: "configs/prompts/query_rewrite_prompt.txt"

embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384
  batch_size: 32

retrieval:
  top_k: 10
  rerank_top_k: 5
  strategy: "hybrid"  # dense, sparse, or hybrid
  hybrid_alpha: 0.5  # weight for dense retrieval

chunking:
  strategy: "recursive"  # recursive or semantic
  chunk_size: 512
  chunk_overlap: 50
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "

agent:
  max_iterations: 10
  use_reflection: true
  reflection_threshold: 7.0
  tools:
    - retriever
    - calculator
    - web_search
    - code_executor

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cors_origins:
    - "http://localhost:3000"
  rate_limit: 60  # requests per minute

observability:
  log_level: "INFO"
  langsmith_tracing: true
  langsmith_project: "rag-agent"
  prometheus_enabled: true
